onboarding = false

[keys]
previous_workspace = "alt+shift+k"
next_workspace = "alt+shift+j"

[[keys.command]]
key = "prefix+ctrl+o"
type = "plugin_action"
command = "agent-chooser.open"
description = "choose an agent needing attention"

[[keys.command]]
key = "prefix+shift+o"
type = "plugin_action"
command = "url-chooser.open"
description = "choose URL from focused pane"

[ui]
sidebar_width = 20
sidebar_min_width = 16
sidebar_max_width = 20
status_indicators = "symbols"
prompt_new_tab_name = false
# Keep help discoverable without reserving a terminal pane or an extra row.
tab_bar_right = [{ type = "text", text = "Ctrl+B ? shortcuts" }]

[ui.toast]
delivery = "herdr"

[ui.toast.clipboard]
enabled = false
position = "top-right"

[ui.sound]
enabled = false
